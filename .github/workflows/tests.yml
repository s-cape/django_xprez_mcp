name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install black
      - run: black --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        django: ["4.1", "4.2", "5.2"]
        exclude:
          - python: "3.12"
            django: "4.1"
          - python: "3.13"
            django: "4.1"
          - python: "3.13"
            django: "4.2"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e . "Django~=${{ matrix.django }}.0"
      - run: python -m django test xprez_mcp.tests --settings=xprez_mcp.tests.settings

  test-drf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e . "Django~=5.2.0" djangorestframework
      - run: python -m django test xprez_mcp.tests --settings=xprez_mcp.tests.settings

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install black
      - run: black --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        django: ["4.1", "4.2", "5.2"]
        exclude:
          - python: "3.9"
            django: "5.2"
          - python: "3.12"
            django: "4.1"
          - python: "3.13"
            django: "4.1"
          - python: "3.13"
            django: "4.2"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # setup-python has no 3.9 builds for current Ubuntu runners; uv does.
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
      - run: uv pip install -e . "Django~=${{ matrix.django }}.0"
      - run: python -m django test xprez_mcp.tests --settings=xprez_mcp.tests.settings

  test-drf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e . "Django~=5.2.0" djangorestframework annotated-types
      - run: python -m django test xprez_mcp.tests --settings=xprez_mcp.tests.settings

  test-postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e . "Django~=5.2.0" "psycopg[binary]"
      - run: python -m django test xprez_mcp.tests --settings=xprez_mcp.tests.settings

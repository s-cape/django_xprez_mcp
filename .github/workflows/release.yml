name: Release and publish to PyPI

# Run from the Actions tab with a version like 0.1.0. The workflow tests,
# tags vX.Y.Z, creates the GitHub release and publishes to PyPI. The package
# version comes from the tag (setuptools-scm), so nothing is committed.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (X.Y.Z, optionally with a PEP 440 pre-release suffix like 0.2.0rc1)"
        required: true

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
            echo "Version '$VERSION' must look like 1.2.3 or 1.2.3rc1"
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Tag the commit locally
        run: git tag "v${{ inputs.version }}"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*
          ls dist | grep -F "${{ inputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/django-xprez-mcp/${{ inputs.version }}/
    permissions:
      id-token: write # PyPI trusted publishing, no API token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          flags=""
          [[ "$VERSION" =~ (a|b|rc)[0-9]+$ ]] && flags="--prerelease"
          gh release create "v$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes $flags

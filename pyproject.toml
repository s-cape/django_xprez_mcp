[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-mcpkit"
version = "0.1.0.dev0"
description = "Admin-style MCP servers for Django: register providers, models, admin classes and functions as MCP tools, resources and prompts."
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.10"
dependencies = [
    "Django>=4.2",
]
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License",
]

[project.optional-dependencies]
dev = [
    "black",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mcpkit*"]

[tool.black]
line-length = 88
target-version = ["py310"]

[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "django-xprez-mcp"
dynamic = ["version"]
description = "Admin-style MCP servers for Django: register providers, models, admin classes and functions as MCP tools, resources and prompts."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "Django>=4.2",
]
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/s-cape/django_xprez_mcp"
Documentation = "https://github.com/s-cape/django_xprez_mcp/blob/main/docs/design.md"
Issues = "https://github.com/s-cape/django_xprez_mcp/issues"

[project.optional-dependencies]
dev = [
    "black",
    "djangorestframework",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["xprez_mcp*"]

# Version comes from the latest git tag (vX.Y.Z); untagged commits get a
# .devN version.
[tool.setuptools_scm]

[tool.black]
line-length = 88
target-version = ["py310"]
